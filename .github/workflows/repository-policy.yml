name: Repository Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Determine whether this workflow source is trusted
        id: policy-source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          if git -C candidate merge-base \
            --is-ancestor "$WORKFLOW_SHA" "$BASE_SHA"
          then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "The ruleset-pinned base-branch workflow performs enforcement."
          fi

      - name: Check out trusted policy
        if: steps.policy-source.outputs.trusted == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-policy
          persist-credentials: false

      - name: Validate workflow permissions and actions
        if: steps.policy-source.outputs.trusted == 'true'
        run: trusted-policy/Scripts/check-workflow-security candidate

      - name: Require an explicit maintainer bypass for policy changes
        if: steps.policy-source.outputs.trusted == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          protected_changes=$(
            git -C candidate diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              grep -E \
                '^(\.github/|Scripts/|Config/|Vendor/|project\.yml$|SECURITY\.md$|PRIVACY\.md$|Packages/ReLandCore/Package(\.resolved)?\.swift$|Apps/ReLandHost/Resources/ReLandHost\.entitlements$|Apps/ReLandClient/Resources/PrivacyInfo\.xcprivacy$)' ||
              true
          )
          if [ -n "$protected_changes" ]; then
            printf '%s\n' \
              "This pull request changes protected policy or supply-chain files:" \
              "$protected_changes" \
              "A maintainer must use the audited repository-ruleset bypass."
            exit 1
          fi
